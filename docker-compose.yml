name: nacho

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-NACHO Vehicle Inspection}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://127.0.0.1:8080}
      APP_LOCALE: ${APP_LOCALE:-fr}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-fr}
      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-nacho_vehicle_inspection}
      DB_USERNAME: ${DB_USERNAME:-nacho}
      DB_PASSWORD: ${DB_PASSWORD:-nacho_secret}
      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@nacho.local}
      MAIL_FROM_NAME: ${APP_NAME:-NACHO Vehicle Inspection}
      RUN_DB_SEED: ${RUN_DB_SEED:-true}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-NachoAdmin2026!}
      BOOKING_NOTIFICATION_EMAIL: ${BOOKING_NOTIFICATION_EMAIL:-bookings@nacho.local}
      CONTACT_NOTIFICATION_EMAIL: ${CONTACT_NOTIFICATION_EMAIL:-contact@nacho.local}
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nacho

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "${DOCKER_HTTP_PORT:-8080}:80"
    depends_on:
      - app
    networks:
      - nacho

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nacho_vehicle_inspection}
      MYSQL_USER: ${DB_USERNAME:-nacho}
      MYSQL_PASSWORD: ${DB_PASSWORD:-nacho_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-nacho_root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - nacho

volumes:
  app_storage:
  app_bootstrap_cache:
  mysql_data:

networks:
  nacho:
    driver: bridge
