# Avoid empty X-Forwarded-* from the client breaking Laravel TrustProxies (Symfony Request::getPort).
map $http_x_forwarded_proto $nacho_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Do not use a bare `location = /robots.txt` here — it 404s before PHP and error_page keeps status 404.

    error_page 404 /index.php;

    location ~ \.php$ {
        # Resolve app at request time (Docker DNS); avoids nginx failing/restarting if app is not up yet.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fpm_backend app:9000;
        fastcgi_pass $fpm_backend;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $nacho_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
