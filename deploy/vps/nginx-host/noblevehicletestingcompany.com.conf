# INITIAL HTTP — use before TLS exists (Certbot will extend this site).
# Host Nginx → NACHO Docker on 127.0.0.1:8083
#
#   sudo cp deploy/vps/nginx-host/noblevehicletestingcompany.com.conf /etc/nginx/sites-available/noblevehicletestingcompany.com
#   sudo ln -sf /etc/nginx/sites-available/noblevehicletestingcompany.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# After Docker is up and http://noblevehicletestingcompany.com loads:
#   sudo certbot --nginx -d noblevehicletestingcompany.com -d www.noblevehicletestingcompany.com
#
# Then replace with noblevehicletestingcompany.com.ssl.conf (apex canonical, www → apex).

server {
    listen 80;
    listen [::]:80;
    server_name noblevehicletestingcompany.com www.noblevehicletestingcompany.com;

    client_max_body_size 32M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
