# Full HTTPS config (use after Certbot certificates exist, or adapt paths Certbot created).
# Replace the HTTP-only site or include from sites-enabled after initial cert issuance.

server {
    listen 80;
    listen [::]:80;
    server_name noblevehicletestingcompany.com www.noblevehicletestingcompany.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://noblevehicletestingcompany.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.noblevehicletestingcompany.com;

    ssl_certificate /etc/letsencrypt/live/noblevehicletestingcompany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noblevehicletestingcompany.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://noblevehicletestingcompany.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name noblevehicletestingcompany.com;

    ssl_certificate /etc/letsencrypt/live/noblevehicletestingcompany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/noblevehicletestingcompany.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
